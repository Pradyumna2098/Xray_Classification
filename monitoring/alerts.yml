groups:
  - name: xray_api_alerts
    interval: 30s
    rules:
      # Alert if API is down
      - alert: APIDown
        expr: up{job="xray-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "X-Ray API is down"
          description: "The X-Ray Classification API has been down for more than 2 minutes."

      # Alert on high error rate
      - alert: HighErrorRate
        expr: rate(xray_api_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "API error rate is above 5% (current: {{ $value | humanizePercentage }})"

      # Alert on high latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(xray_api_request_latency_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile latency is above 2 seconds (current: {{ $value }}s)"

      # Alert on low prediction rate (potential issue)
      - alert: LowPredictionRate
        expr: rate(xray_predictions_total[5m]) < 0.01
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low prediction rate"
          description: "Prediction rate is unusually low. Current rate: {{ $value }} predictions/second"
